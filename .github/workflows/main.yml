name: Update README cards

on:
  schedule:
    # 09:00 UTC — roughly 4am Houston. Off-peak runs are less likely to be queued.
    - cron: "0 9 * * *"
  workflow_dispatch:

jobs:
  cards:
    runs-on: ubuntu-latest

    # Required for the commit step. Without this the push fails with a 403.
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Generate stats card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&theme=buefy&hide_border=true
          path: profile/stats.svg
          token: ${{ secrets.TOKEN }}
          fail_on_error: true

      - name: Generate top languages card
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&theme=buefy&hide_border=true&size_weight=0.5&count_weight=0.5
          path: profile/top-langs.svg
          token: ${{ secrets.TOKEN }}
          fail_on_error: true

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: update README cards" || exit 0
          git push
